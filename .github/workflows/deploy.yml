name: CoffeeNChill Part 3 CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coffeenchill-production
  cancel-in-progress: false

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Gateway
        run: dotnet build CoffeeNChill.Gateway/CoffeeNChill.Gateway.csproj -c Release

      - name: Build Functions
        run: dotnet build CoffeeNChill.Functions/CoffeeNChill.Functions.csproj -c Release

      - name: Run authentication unit tests
        run: dotnet test CoffeeNChill.Tests/CoffeeNChill.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Set image version
        id: version
        run: echo "tag=p3-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Gateway
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./CoffeeNChill.Gateway/Dockerfile
          push: true
          tags: yashkeshav/coffeenchill-gateway:${{ steps.version.outputs.tag }}

      - name: Build and push Functions
        uses: docker/build-push-action@v7
        with:
          context: ./CoffeeNChill.Functions
          file: ./CoffeeNChill.Functions/Dockerfile
          push: true
          tags: yashkeshav/coffeenchill-functions:${{ steps.version.outputs.tag }}

      - name: Deploy to Azure Linux VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          IMAGE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh -o BatchMode=yes -o IdentitiesOnly=yes \
            -i ~/.ssh/id_ed25519 \
            "$VPS_USER@$VPS_HOST" \
            "bash -se -- '$IMAGE_TAG'" <<'REMOTE'
          set -euo pipefail

          IMAGE_TAG="$1"
          cd /home/azureuser/coffeenchill-p3

          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "STOP: Uncommitted VPS repository changes."
            exit 1
          fi

          git fetch origin "+refs/heads/main:refs/remotes/origin/main"
          git switch -C deploy origin/main

          test -f .env

          if grep -q '^IMAGE_TAG=' .env; then
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/" .env
          else
            printf '\nIMAGE_TAG=%s\n' "$IMAGE_TAG" >> .env
          fi

          chmod 600 .env

          sudo docker compose \
            -f compose.p3.yaml \
            -f compose.public.yaml \
            config --quiet

          sudo docker compose \
            -f compose.p3.yaml \
            -f compose.public.yaml \
            pull

          sudo docker compose \
            -f compose.p3.yaml \
            -f compose.public.yaml \
            up -d --no-build

          curl --fail --silent --show-error \
            --retry 8 --retry-delay 4 \
            --retry-connrefused \
            http://127.0.0.1:7350/api/menu > /dev/null

          echo "PASS: CoffeeNChill deployed successfully."
          REMOTE

      - name: Verify public HTTPS endpoint
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 4 \
            https://coffeenchill-p3.southafricanorth.cloudapp.azure.com/api/menu \
            > /dev/null

          echo "PASS: Public HTTPS API is working."
