name: coffeenchill-part2
services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data --disableProductStyleUrl
    ports:
      - "127.0.0.1:10000:10000"
      - "127.0.0.1:10001:10001"
      - "127.0.0.1:10002:10002"
    volumes:
      - storage:/data
    networks: [coffee]
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(10002,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));"]
      interval: 5s
      timeout: 3s
      retries: 20

  functions:
    image: yashkeshav/coffeenchill-functions:v2.0
    ports:
      - "127.0.0.1:7170:80"
    environment:
      FUNCTIONS_WORKER_RUNTIME: dotnet-isolated
      AzureWebJobsStorage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"
      AzureStorageConnectionString: "${AZURE_FILES_CONNECTION_STRING:?Set the Azure Files connection string first}"
    depends_on:
      azurite:
        condition: service_healthy
    networks: [coffee]

networks:
  coffee:
    driver: bridge
volumes:
  storage:
    external: true
    name: coffeenchill-part2-data