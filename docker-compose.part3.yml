name: coffeenchill-part3

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    command: >
      azurite
      --blobHost 0.0.0.0
      --queueHost 0.0.0.0
      --tableHost 0.0.0.0
      --location /data
      --disableProductStyleUrl
    volumes:
      - part3_storage:/data
    expose:
      - "10000"
      - "10001"
      - "10002"
    networks:
      - coffee_backend
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const s=require('net').connect(10002,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));"
      interval: 5s
      timeout: 3s
      retries: 20

  functions:
    image: yashkeshav/coffeenchill-functions:v3.0
    environment:
      FUNCTIONS_WORKER_RUNTIME: dotnet-isolated
      AzureWebJobsStorage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1"
      AzureStorageConnectionString: ${COFFEENCHILL_AZURE_FILES_CONNECTION_STRING:-}
    expose:
      - "80"
    depends_on:
      azurite:
        condition: service_healthy
    networks:
      - coffee_backend

networks:
  coffee_backend:
    driver: bridge

volumes:
  part3_storage:
